    on the Internet. This allows consumers to develop and use services with browsers
    or other thin clients instead of investing in hardware, software, or maintenance.
    Use this to On-Demand or Software as a Service to describe the Salesforce delivery
    model.
  CloudPages: CloudPages is a Marketing Cloud application used to create and publish
