  Checkout quote: A Checkout quote is a convenient, risk-free way to price products
    or services and terms before placing an order. Quotes can be for new business,
    add-ons, upgrades, or renewals.
  Classic app: Term for standard and custom apps in Salesforce Classic.
  Clickjack Protection for Visualforce Pages: Clickjack protection secures your Visualforce
    pages against user interface redress attacks. You can enable clickjack protection
    for Visualforce pages that suppress the standard header. The setting is global
    to your organization and applies to all your Visualforce pages.
  clickjack: Malicious technique of tricking a Web user into clicking on something
    different from what the user perceives they are clicking on, potentially revealing
    confidential information or taking control of their computer while clicking on
    seemingly innocuous web pages. A clickjack takes the form of embedded code or
    a script that can execute without the user's knowledge.
