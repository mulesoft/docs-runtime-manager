  analytic snapshot source report: The custom report scheduled to run and load data
    as records into a custom object.
  analytic snapshot: An analytic snapshot lets you report on historical data. Authorized
    users can save tabular or summary report results to fields on a custom object,
    then map those fields to corresponding fields on a target object. They can then
    schedule when to run the report to load the custom object's fields with the report's
    data.
  analytic snapshot running user: The user whose security settings determine the source
    report's level of access to data. This bypasses all security settings, giving
    all users who can view the results of the source report in the target object access
    to data they might not be able to see otherwise.
  analytic snapshot target object: The custom object that receives the results of
    the source report as records.
  Analytics Builder: Analytics Builder enables you to gain deep insights into the
    behaviors and interests of your contacts across channels. Use these insights to
    set marketing goals and refine customer journeys.
  Android: 'Android is an operating system for mobile devices developed by the Open
    Handset Alliance. When specifying a version of the Android operating system, use
    the word release (lowercase) followed by the release number. Example: Android
    release 3.0.'
  ANI: The number from which a caller is dialing in Salesforce CRM Call Center.
  App Launcher: The App Launcher presents logos that link to your connected apps and
    standard apps, all from one tab in Salesforce. Users must be assigned a profile
    or permission set with Use Identity Features enabled and the App Launcher set
    to Visible to see it. Then, it appears as an app in the Force.com App Menu.
  App Store: Name of Apple's online store for downloadable iOS apps
  approval process: An approval process is an automated process your organization
    can use to approve records in Salesforce. An approval process specifies the steps
    necessary for a record to be approved and who must approve it at each step. A
    step can apply to all records included in the process, or just records that meet
    certain administrator-defined criteria. An approval process also specifies the
    actions to take when a record is approved, rejected, recalled, or first submitted
    for approval.
  Application Hub: An app where you can manage all your Salesforce environments in
    one place, and where admins and developers can work collaboratively to manage
    the creation and distribution of apps.
  approval process diagram: A visual flowchart representation of an approval process.
    From a detail page of an approval process, you can open the diagram by launching
    the Process Visualizer.
  approval request: An approval request is an email, Salesforce1 notification, or
    Chatter post notifying the recipient that a record was submitted for approval
    and that his or her approval is requested.
  Approvals in Chatter: If your organization has both Approvals and Chatter enabled,
    administrators can turn on Approvals in Chatter, which lets users receive approval
    requests as posts in their Chatter feeds.
  approval steps: Approval steps assign approval requests to various users and define
    the chain of approval for a particular approval process. Each approval step specifies
    the attributes a record must have to advance to that approval step, the user who
    can approve requests for those records, and whether to allow the delegate of the
    approver to approve the requests. The first approval step in a process specifies
    the action to take if a record does not advance to that step. Subsequent steps
    in the process allow you to specify what happens if an approver rejects the request.
  archived article: Archived articles were published but later removed from public
    visibility. Article managers can view and manage archived articles on the Article
    Management tab by clicking the Articles tab in the View area and choosing Archived
    Articles. Archived articles are not visible in the Articles tab (in any channel)
    or the public knowledge base. Articles can be archived manually or automatically
    via an expiration date.
