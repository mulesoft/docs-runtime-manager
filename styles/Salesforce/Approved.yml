    follow, and updates to records you follow, and posts to groups you''re a member
    ofOn profiles, where you can see posts made by the person whose profile you''re
    viewing. On records, where you can see updates to the record you''re viewing.
    On Chatter groups, where you can see posts to the group you''re viewing'
  Chatter group: 'Chatter groups let you share information with specific people. For
    example, if you''re working on a project and want to share information only with
    your team members, you can create a Chatter group for your team. Chatter groups
    include a list of members, a Chatter feed, and a photo. You can create the following
    types of Chatter groups: Public: Only group members can post, but anyone can see
    the posts and join the public group.Private: Only group members can post and see
    the posts. The group''s owner or managers must add members.'
  Chatter influence: An indicator of a person's influence in Chatter. The number of
    posts and comments the person makes, and the number of comments and likes the
    person receives determine the level of influence. Top Influencers lead collaboration
    efforts by regularly sharing essential content.Active Influencers encourage others
    to get involved and share knowledge.Observers are quiet participants or just getting
    started in Chatter.
  Chatter mobile: A free mobile application that lets you collaborate in Chatter from
    your mobile device. Use Chatter Mobile to post and comment in Chatter, and receive
