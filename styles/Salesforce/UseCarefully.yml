  Falcon Site Reliability Engineering: After first mention, use FSRE.
  Federal Risk and Authorization Management Program: 'INTERNAL USE ONLY

    After first mention, use FedRAMP.'
  Hyperforce Development Platform Support: After first use, use HDPS.
  Interim Authorization to Test: Use IATT after the first mention
  (3PAO): Alternatively, use Third-Party Assessment Organization, with the number
    3 and every first letter capitalized.
  air-gapped Government Cloud environment: Use to describe a Government Cloud computer
    system isolated from the internet. Sometimes referenced as the "high side."
  ATO: 'Alternatively, use authority to operate. The term should be spelled out on
    its first mention, with the acronym used for all subsequent mentions.

    '
  BPO: Base Platform Object. A layer allowing the Salesforce custom entity platform
    to store data for Internal Doc features
  CJIS: Alternatively, use Criminal Justice Information Systems, with every first
    letter capitalized.
  Core App: "Houses the platform and apps that power our Sales, Service, and Industry\
    \ solutions. This also includes API frameworks, integrations, and unified metadata.\
    \ For example: data APIs (SOAP, REST, Connect REST), Metadata API, packaging,\
    \ entities schema, formulas, flow, Apex.  \n"
  Core: " \n\nA Salesforce architecture; it’s our Java-based monolithic codebase and\
    \ runtime. We never use “Core” in place of the “Core App” in external documentation."
  CodeGenie: The AI tool that returns answers on internal sites like the Core DX Unified
    Doc Site.
  CIS: Alternatively, use Control Implementation Summary, with every first letter
    capitalized. The term should be spelled out on its first mention, with the acronym
    used for all subsequent mentions.
  CRM: Alternatively, use Customer Responsibility Matrix, with every first letter
    capitalized. The term should be spelled out on its first mention, with the acronym
    used for all subsequent mentions.
  CRST: Code Review Stage Testing involves testing for changes going into the core
    app code base during the review stage of development. CRST runs more tests than
    precheckin by running static analysis, unit tests and recommended functional tests.
  CPTC: Alternatively, use Cloud Permission to Connect, with every first letter capitalized,
    except "to".  The term should be spelled out on its first mention, with the acronym
    used for all subsequent mentions.
  CSSP: Alternatively, use Cybersecurity Service Provider, with every first letter
    capitalized. The term should be spelled out on its first mention, with the acronym
    used for all subsequent mentions.
  EEMSG: Alternatively, use Enterprise Email Security Gateway, with every first letter
    capitalized. The term should be spelled out on its first mention, with the acronym
    used for all subsequent mentions.
  DoD: Alternatively, use Department of Defense with every first letter capitalized,
    except or.
  DISA: Alternatively, use Defense Informations Systems Agency, with every first letter
    capitalized. The term should be spelled out on its first mention, with the acronym
    used for all subsequent mentions.
  Falcon CLI: A single CLI for all Falcon platform interactions, including interactive
    inner loop and outer loop commands.
  Falcon: A set of common principles, architecture patterns, and shared services to
    which service and product teams must adhere to launch into public-cloud environments.
    The term is also used to refer to the Salesforce cloud-native architecture as
    a whole and to the program for transitioning Salesforce infrastructure and products
    to public cloud. Externally, Falcon is known as Hyperforce.
  FIREInfra: FIREInfra, which stands for Fast, Integrated, Repeatable Environments
    Infrastructure, is a CoreDX team responsible for FIREInfra Internal Doc environments,
    including test and performance environments. This includes TEST, PERF, and UPGRADE
    cells in Falcon and STEAM environments.
  FTest Console (FTC): For the Core App, use the FTest Console to select which tests
    to run, execute those tests, and view FTest results.
  FTest: In the Core App, a test that tests functions across modules. It’s similar
    to an integration test.
  GDoT: Alternately, use Global Directory of Tenants. The term should be spelled out
    on its first mention, with the acronym used for all subsequent mentions.
  Honuapp: 'INTERNAL USE ONLY

    The CLI framework that Salesforce uses to install and manage various tools and
    utilities needed for CRM Core development.'
  Inkslinger: 'Internal Use Only. Do not use in customer-facing text. Internal training
    for CX. '
  Off Core: Software and services that are separate from the Core App and platform.
  Near Core: 'A strategy and pattern for using the Core App; Near Core hosts platform
    building blocks without having to build the rest of a product’s app or features
    in the Core monolith. Near-Core services are integrated with and use the Core
    platform identity, data model, and services but aren’t part of the Core App codebase.


    '
  Near-Core: Use Near Core (with a space) as a noun, and Near-Core (with a hyphen)
    as a compound adjective. For example, "item in Near Core" and "Near-Core services"
    are both correct; "add x to Near-Core" is incorrect.
  NTK: Alternatively, use Need to Know, with every first letter capitalized. Use as
    "a NTK" not "an NTK".  The term should be spelled out on its first mention, with
    the acronym used for all subsequent mentions.
  SIS-V: Alternatively, use Salesforce Industrial Security Verification, with every
    first letter capitalized.  The term should be spelled out on its first mention,
    with the acronym used for all subsequent mentions.
