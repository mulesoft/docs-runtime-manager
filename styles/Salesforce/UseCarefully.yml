extends: substitution
message: '%s'
level: warning
ignorecase: false
swap:
  Anypoint DataGraph: 'After first mention, use DataGraph.


    Don''t pluralize or make possessive. Being a product name, it doesn''t take an
    article.'
  Salesforce Lightning Design System 1: Rebranding of the original "SLDS" as of 2025.
    Spell out only on first reference., and precede with "the." Thereafter, say "the
    SLDS 1."
  Salesforce Lightning Design System 2: Evolution of the original "SLDS" as of 2025.
    Spell out only on first reference, and precede with "the.". Thereafter, say "SLDS
    2."
  Agent2Agent: After first mention, you can abbreviate to A2A.
  Model Context Protocol: After first mention, you can abbreviate to MCP.
  Topic Center: Don't pluralize or make possessive. Being a product name, it doesn't
    take an article.
  API Catalog: 'Don''t pluralize or make possessive. Being a product name, it doesn''t
    take an article.


    Salesforce (Agentforce): use MuleSoft for Agentforce: API Catalog'
  Anypoint API Manager: 'MuleSoft: After first mention, use API Manager.

    Salesforce: Use full name when referring to Anypoint API Manager.


    Don''t pluralize or make possessive. Being a product name, it doesn''t take an
    article.'
  Anypoint Exchange: 'MuleSoft: After first mention, use Exchange.

    Salesforce: Use full name when referring to Anypoint Exchange.


    Don''t pluralize or make possessive. Being a product name, it doesn''t take an
    article.'
  Field: Don't capitalize "field" when it's part of a name, unless it’s in a heading
    or considered part of the proper name.
  Black Tab: '"Don''t use in customer-facing content. Treat as a proper noun: Black
    Tab. Two words. Don''t hyphenate. '
