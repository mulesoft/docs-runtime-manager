  Visual Studio Code: After first mention, use VS Code.
  First-Generation Packaging: After first mention, use 1GP.
  Bulk API: Both Bulk API and Bulk API 2.0 are supported products, so don't use "Bulk
    API" if you mean "Bulk API 2.0" instead.
  Bulk API 2.0: Bulk API and Bulk API 2.0 are both supported products, so don't shorten
    the "Bulk API 2.0" name to "Bulk API" after first mention. If you mean "Bulk API
    2.0," use that name in every mention.
  entity relationship diagram: Not a proper noun, so use lowercase. Abbreviate to
    ERD after first mention.
  GitHub: If you mean the version-control system, and not the cloud-based developer
    platform, use Git instead.
  License Management App: Abbreviate to LMA after first mention.
  polyfill: A common noun, so don't capitalize.
  Second-Generation Packaging: After first mention, use 2GP.
  Integration Procedures: Capitalize only when referring to the Omnistudio feature.
  Cadence Builder: Don't shorten to Builder.
  Einstein: For usage guidance, see  "Einstein terminology" in the style guide.
  Chatter REST: 'In general, the new name is Connect REST API for what we used to
    call Chatter REST API.


    BUT rate limiting changes sometimes force us to delineate Chatter REST APIs within
    Connect REST APIs. Check with your SMEs if you''re not sure which name to use.




    '
  Marketing Cloud Account Engagement: Replaces "Pardot." On first mention, say "Marketing
    Cloud Account Engagement." Thereafter, say "Account Engagement."
  the Marketing Cloud: Don't use "the" in front of Marketing Cloud when referring
    to the product name. You can use "the" when it's modifying a feature.
  Salesforce Platform: Use the Salesforce Platform on first mention. If the content
    that follows refers only to the Salesforce Platform, it’s OK to shorten to just
    "the platform." But if the content discusses multiple platforms, use the full
    term in each mention for clarity.
  Help: Don't refer to the Help portal or any variants.
  Editable: When used to identify a property of a record or element in a reference
    topic, "Editable" is capitalized.
  Connect REST API: When Connect REST API is the noun, don't put "the" in front of
    it. You can use "the" when referring to a feature or a component of it.
  D&B: Don't use D&B (except in D&B Company field)
  Salesforce, Inc: "Use Salesforce, Inc. only in copyright and trademark text.\r\n\
    \r\nAvoid Salesforce, Inc. except when using standard legal or copyright language.\r\
    \n\r\nThe CRM stock symbol, CUSIP/ISN number, and penchant for puns remain the\
    \ same."
