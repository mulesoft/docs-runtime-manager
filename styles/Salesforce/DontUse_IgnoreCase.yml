  would: Avoid the conditional could, might, should and would in hypothetical examples.
    Present indicative and imperative are better because they're less wordy and more
    direct.
  could: Avoid the conditional could, might, should and would in hypothetical examples.
    Present indicative and imperative are better because they're less wordy and more
    direct.
  bug: 'Use issue, problem, error, or change, not bug or defect.


    Use the past tense: fixed an issue'
  click here: Never use "Click Here" as link text.
  very: Avoid adverbs that don't carry important meaning.
  somewhat: Avoid adverbs that don't carry important meaning.
  extremely: Avoid adverbs that don't carry important meaning.
  basically: Avoid adverbs that don't carry important meaning.
  actually: Avoid adverbs that don't carry important meaning.
  obviously: Avoid adverbs that don't carry important meaning.
  probably: Avoid adverbs that don't carry important meaning.
  definitely: Avoid adverbs that don't carry important meaning.
  practically: Avoid adverbs that don't carry important meaning.
  really: Avoid adverbs that don't carry important meaning.
  a lot: Avoid a lot or replace it with a less wordy alternative such as several,
