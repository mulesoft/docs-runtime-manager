extends: substitution
message: '%s ''%s'''
level: error
ignorecase: true
swap:
  etc: ''
  and above: 'For API and product version numbers:


    Use "and later" instead of "and above," as in "Internet Explorer 7.0 and later."'
  create a new: 'Just say "create a __" instead of "create a new __," etc.


    The button standard is "New ___." See https://confluence.internal.salesforce.com/x/dQWGC.'
  Create New: 'For buttons, say "New" or "New [Thing]" instead. See the Button standard:
    https://confluence.internal.salesforce.com/x/dQWGC '
  administrator: 'Generally say "Salesforce admin" on first mention and "admin" after
    that.


    Exception: The edge case related to "Black Tab."'
  system administrator: 'Generally say "Salesforce admin" on first mention and "admin"
    after that.


    Exception: The edge case related to "Black Tab."'
  may: 'Avoid "may," "might," and other modal verbal phrases.


    Note: Don''t change modal verbs that appear in legal boilerplate text such as
    disclosures.


    MuleSoft: Use only in the context of permissions'
  lets: Avoid permissive language unless you're talking about permissions. Don't use
    "lets" when what you mean is "makes possible."
  let: Avoid permissive language unless you're talking about permissions. Don't use
    "let" when what you mean is "make possible."
  have to: 'As a general rule, avoid "have to." The phrase is hard to translate in
    some languages, and omitting it also reduces word count and improves the tone
    of your content. '
  surface: 'What we used to call an agent "surface" we now refer to as an agent "connection."  '
  surfaces: 'What we used to call an agent "surface" we now refer to as an agent "connection."  '
  config: Spell out "configuration" instead.
  Activate: 'Don''t use, except in Tableau doc. '
  click on: 'Use "click" instead.  Click means click the left mouse button. '
  Plan of Actions and Milestones: Every first letter capitalized. After first mention,
    use POA&M.
  Pager Duty: Use PagerDuty.
  gimlet: Outdated codename for Core-on-Git. Use Core-on-Git instead.
  GovCloud: Always say Government Cloud.
  customer user journey: Use critical user journey.
  Core on Git: Should be hyphenated. Use Core-on-Git instead.
  black-tab: "\"Don't use in customer-facing content. Treat as a proper noun: Black\
    \ Tab. Two words. Don't hyphenate. \n\nReplace with \"Black Tab\" instead."
  blacktab: "\"Don't use in customer-facing content. Treat as a proper noun: Black\
    \ Tab. Two words. Don't hyphenate. \n\nReplace with \"Black Tab\" instead."
  ad-hoc release: Use "ad hoc release" instead.
  account executive service owner: Use accountable executive service owner.
  logical service: What we once called a "logical service" is now called a "feature."
  physical service: Now that "feature" has replaced "logical service," we don't need
    to distinguish between logical and physical services.
  Omnichannel: 'MuleSoft: Use multichannel instead'
  FIREBoM: Use FIRE BOM instead
  might: Avoid the conditional could, might, should and would in hypothetical examples.
    Present indicative and imperative are better because they're less wordy and more
    direct.
  desire: Don't use terms that belong in a Tennessee Williams play.
  wish: Too fluffy. Be more direct.
  desired: 'Avoid flowery language. Be more direct.

    '
  revert back: ''
  add an additional: ''
  add additional: ''
  should: 'Avoid the conditional "could, might, should, and would" in hypothetical
    examples. Present indicative and imperative are better because they''re less wordy
    and more direct.

    See "modal verbs" in the style guide for examples of writing around "should."'
  hotfix: A hotfix is a software update that is released outside the normal update
    cycle or intended to be applied to a live system; often to fix a bug. Don't use
    "hotfix" as a verb to mean the application of a hotfix to a system -- that's too
    jargony.
  Trailhead Superbadge: ''
  realtime: 'Noun: "real time"

    Adjective: "real-time"'
  visually impaired: ''
  utilized: Don't use. Substitute a simpler word.
  utilizes: Don't use. Substitute a simpler word.
  Datorama Reports for Marketing Cloud: Datorama is called Marketing Cloud Intelligence
    as of 2022.
  MC Intelligence: 'Replaces the term ''Datorama'' since 2022. '
  ought to: For more examples, see "modal verbs" in the style guide.
  reply to address: Hyphenate "reply-to" when a compound adjective.
  need to: 'As a general rule, avoid "need to." It''s hard to translate in some languages,
    and omitting it also reduces word count and improves the tone of your content. '
  Workbench: "Workbench isn’t supported by Salesforce and shouldn’t be mentioned in\
    \ external content. \n\nThe replacement term for Workbench depends on multiple\
    \ factors, so we can’t recommend a term here. There are several tools that provide\
    \ functionality similar to some Workbench features, so consider how the customer\
    \ used Workbench in the context you’re describing. See the Salesforce Help topic\
    \ “Replacement Tools for Workbench.\"\n\nFor questions about alternative tools\
    \ for Workbench, refer to the #workbench-eol Slack channel."
  SFX: ''
  color-blind: ''
  total solution: Don't editorialize in technical documentation.
  the Help and Training portal: ''
  state-of-the-art: Don't editorialize in technical documentation.
  state of the art: Don't editorialize in technical documentation.
  utilize: Don't use. Substitute a simpler word, such as use.
  user-friendly: Don't editorialize in technical documentation.
  white box: ''
  black box: ''
  Searchinator answers: ''
  Searchinator search: ''
  seamless: Don't editorialize in technical documentation.
  pull the plug: ''
  powerful feature: Don't editorialize in technical documentation.
  popup window: Don't use popup window to describe an overlay window in the UI. Just
    call it a window instead.
  online help: Don't refer to the Help and Training Portal or any variants.
  master: 'Use scrum lead to replace scrum master.


    Use Main Services Agreement (MSA) to replace Master Subscription Agreement (MSA).


    Don''t use master in new features, documentation or UI text to mean main, primary,
    principal, source, leader, active, or controller.


    Consider main or primary as alternatives.

    Change master now if doing so doesn’t cause problematic inconsistencies in your
    doc set.

    If your scrum team suggests the term in a new feature or UI element, you can use
    another term.

    Fixing master can be complicated because of seven possible alternatives and the
    legal references that can’t change.'
  blind: ''
  robust: Instead of saying "robust," say WHY or HOW something is robust.
  license management org: ''
  kind of: Avoid adverbs that don't carry important meaning.
  i.e.: Avoid Latin expressions.
  the Salesforce Help: Don't refer to the Help and Training Portal or any variants.
  H&T: Don't refer to the Help and Training Portal or any variants.
  etc.: Avoid Latin expressions.
  et al.: Avoid Latin expressions.
  en masse: Avoid non-English-language expressions.
  e.g.: ''
