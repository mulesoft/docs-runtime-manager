extends: substitution
message: '%s ''%s'''
level: error
ignorecase: false
swap:
  Lightning Design System Styling Hooks: Replaced by "SLDS 1" and "SLDS 2" in 2025.
    Spell out "the Salesforce Lightning Design System [1 or 2]" only on first reference.
  SLDS: Replaced by "SLDS 1" and "SLDS 2" in 2025. Spell out "the Salesforce Lightning
    Design System [1 or 2]" only on first reference.
  non-Government Cloud: ''
  LDS: Replaced with "the SLDS 1" (formerly just "SLDS") and "the SLDS 2" in 2025.
  Flexi-Page: When you're talking about the object in the API, use "FlexiPage". In
    all other cases, use "Lightning page."
  Searchinator: Previous name for CodeGenie for Search/Ask CodeGenie.
  OSC: Stands for "Operations Service Center." This team is now inactive and has merged
    with Site Reliability (SR).
  UDD: An outdated internal acronym for the Unified or Universal Data Dictionary.
    This has been replaced by the Universal Metadata Dictionary (UMD).
  l10n: Jargon/abbreviation for "localization." Spell out the term instead.
  Einstein Copilot Studio: The obsolete name for what we now call Agent Studio.
  Tableau CRM: Rebranded as "CRM Analytics"
  Salesforce-Pardot: ''
  Salesforce Datorama: Datorama is now called Marketing Cloud Intelligence.
  Customer Data Platform: ''
  Salesforce CDP: ''
  DataRaptor: ''
  Salesforce Help Portal: ''
  timezone: ''
  Evergage: New product name is Interaction Studio. (It was formerly Evergage.)
  Salesforce AppExchange: Use AppExchange, not the AppExchange or Salesforce AppExchange.
  Salesforce Trailhead Superbadge: ''
